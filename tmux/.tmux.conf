# set -g default-terminal "xterm-ghostty"
# set -g default-terminal "xterm-256color"
set -g extended-keys on
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1
set -g mouse on
set -g focus-events on

set-option -g set-clipboard on
set-option -g allow-passthrough on

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Ctrl-V like vim: start block selection, or toggle rectangle if already selecting
bind-key -T copy-mode-vi C-v if-shell -F '#{selection_present}' 'send-keys -X rectangle-toggle' 'send-keys -X begin-selection ; send-keys -X rectangle-toggle'


# Vague colorscheme BEGIN =============================================================================
set -g status on
set -g status-interval 1
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=white,bg=#1c1c24"
set -g status-justify absolute-centre

set -g message-style "fg=black,bg=cyan"

set -g status-left "#[fg=black,bg=cyan]  #H #[fg=white,bg=black]  #S #{prefix_highlight}"

#set -g status-right " #[fg=white,bg=black] 󰃭 %A %d %b #[fg=black,bg=cyan] 󰥔 %I:%M:%S %p "
# 24h time format
set -g status-right " #[fg=white,bg=black] 󰃭 %A %d %b #[fg=black,bg=cyan] 󰥔 %H:%M "

setw -g window-status-separator " "
setw -g window-status-format "#[fg=black,bg=brightwhite] #I #[fg=white,bg=black] #(/home/user/.claude/scripts/tmux-claude-spinner.sh '#{window_id}')#W "
setw -g window-status-current-format "#[fg=black,bg=yellow] #I #[fg=white,bg=black] #(/home/user/.claude/scripts/tmux-claude-spinner.sh '#{window_id}')#W "

# clear done/attention markers for a window once you switch to it (busy spinner is left alone)
set-hook -g after-select-window "run-shell -b \"rm -f /tmp/claude-done-#{window_id} /tmp/claude-attention-#{window_id}\""

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=black]#[bg=yellow]"
set -g @prefix_highlight_output_suffix ""

# Pane borders
set -g pane-border-style "fg=#1c1c24"
set -g pane-active-border-style "fg=cyan"
# Vague colorscheme END ===============================================================================
